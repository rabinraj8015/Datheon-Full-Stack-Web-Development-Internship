<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>My Task Manager</h1>
        <p>Plan your day. Complete your goals.</p>
    </header>

    <main class="container">
        <section class="task-form">
            <h2>Add a New Task</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    required
                >

                <select id="taskCategory">
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Study">Study</option>
                </select>

                <input type="date" id="taskDueDate">

                <button type="submit" id="submitBtn">Add Task</button>
            </form>
        </section>

        <section class="task-section">
            <h2>My Tasks</h2>

            <div class="filters">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <input
                type="search"
                id="searchInput"
                placeholder="Search tasks..."
                aria-label="Search tasks">

            <p id="taskCount">0 tasks</p>
            <div id="taskList"></div>
        </section>
    </main>

    <footer>
        <p>Task Manager | Built with HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
